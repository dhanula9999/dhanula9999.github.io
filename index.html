<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhanula Personal Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">Dhanula</div>
        <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">☀️</button>
        <button id="navToggle" class="nav-toggle">☰</button>
        <nav id="mainNav">
            <a href="#photos">Photos</a>
            <a href="#stories">Stories</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Photos Section (Instagram Style Grid) -->
        <section id="photos">
            <h2>Gallery</h2>
            <div id="photoLoading" style="display:none; text-align:center;">Loading photos...</div>
            <div id="photoError" style="display:none; text-align:center; color:red;">Failed to load photos.</div>
            
            <!-- Gallery Grid -->
            <div id="gallery"></div>
        </section>

        <!-- Stories Section -->
        <section id="stories">
            <h2>Memories</h2>
            <div class="story-tabs">
                <span class="story-highlight active" onclick="selectStory('2026')">2026</span>
                <span class="story-highlight" onclick="selectStory('2025')">2025</span>
            </div>

            <div class="story-header">
                <h3 id="selectedTitle">2026</h3>
                <span id="memoryCount">0 memories</span>
                <button onclick="openStoryGallery()" class="view-all-btn">View All</button>
            </div>

            <div class="memory-slider-container">
                <button class="slider-btn prev-btn" onclick="prevPhoto()">❮</button>
                <div id="memoryGrid" class="memory-grid"></div>
                <button class="slider-btn next-btn" onclick="nextPhoto()">❯</button>
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact">
            <h2>Get In Touch</h2>
            <form onsubmit="handleContactSubmit(event)">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" rows="4" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <!-- Lightbox Modal for Full Image View -->
    <div id="imageModal" class="modal">
        <span class="close-btn" onclick="closeImage()">&times;</span>
        <button class="modal-nav modal-prev" onclick="prevModalImage()">❮</button>
        <img id="fullImage" class="modal-content" src="" alt="Full View">
        <button class="modal-nav modal-next" onclick="nextModalImage()">❯</button>
    </div>

    <!-- View All Stories Modal -->
    <div id="storyGalleryModal" class="modal">
        <div class="modal-wrapper">
            <span class="close-btn" onclick="closeStoryGallery()">&times;</span>
            <h3 id="galleryModalTitle">Memories</h3>
            <div id="storyGalleryGrid" class="story-gallery-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
