<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhanula Personal Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Liquid Glass Floating Nav Bar -->
    <header class="header-container">
        <nav class="main-nav" id="mainNav">
            <a href="#home" class="active">Home</a>
            <a href="#about">About Me</a>
            <a href="#stories">Stories</a>
            <a href="#photos">My Photos</a>
            <a href="#contact">Contact</a>
        </nav>
        <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">🌙</button>
        <button id="navToggle" class="nav-toggle" aria-label="Toggle Navigation">☰</button>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        <!-- Stories / Memories Section -->
        <section id="stories" class="section">
            <div class="section-header">
                <h2>Stories & Memories</h2>
                <div class="story-highlights">
                    <button class="story-highlight active" onclick="selectStory('2026', event)">2026</button>
                    <button class="story-highlight" onclick="selectStory('2025', event)">2025</button>
                </div>
            </div>

            <div class="memory-status">
                <span id="selectedTitle">2026</span> - <span id="memoryCount">0 memories</span>
                <div class="memory-controls">
                    <button onclick="prevPhoto()">❮ Prev</button>
                    <button onclick="nextPhoto()">Next ❯</button>
                    <button onclick="openStoryGallery()">View All</button>
                </div>
            </div>

            <div id="memoryGrid" class="memory-grid"></div>
        </section>

        <!-- Photos Section -->
        <section id="photos" class="section">
            <div class="section-header">
                <h2>My Photos</h2>
                <button id="viewMoreBtn" class="glass-btn" onclick="toggleViewAllPhotos()">View More</button>
            </div>
            <div id="gallery" class="photo-gallery"></div>
        </section>
    </main>

    <!-- Image Lightbox Modal -->
    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closeImage()">&times;</span>
        <button class="modal-nav prev" onclick="prevModalImage()">❮</button>
        <div class="modal-content-wrapper">
            <img id="fullImage" class="modal-content" src="" alt="Full View">
            <p id="storyCaption"></p>
        </div>
        <button class="modal-nav next" onclick="nextModalImage()">❯</button>
    </div>

    <!-- Story Gallery Modal -->
    <div id="storyGalleryModal" class="modal">
        <div class="modal-body glass-panel">
            <span class="close-modal" onclick="closeStoryGallery()">&times;</span>
            <h3 id="galleryModalTitle">Memories</h3>
            <div id="storyGalleryGrid" class="story-gallery-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
